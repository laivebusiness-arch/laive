<title>LAIVE</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
background: url('https://i.pinimg.com/736x/7d/b2/01/7db2014ba8f14acd376a71470d33dbd9.jpg') no-repeat center center fixed;
background-size: cover;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

.container {
background-color: rgba(0, 0, 0, 0.85);
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
padding: 40px;
width: 100%;
max-width: 500px;
text-align: center;
position: relative;
overflow: hidden;
}

.profile-image {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #333;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    margin: 0 auto 20px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
}

.profile-image img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

h1 {
color: #fff;
margin-bottom: 30px;
font-size: 2.5rem;
text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
}

.links-grid {
display: grid;
gap: 20px;
}

.link-card {
background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
border-radius: 15px;
padding: 20px;
text-decoration: none;
color: #fff;
display: flex;
align-items: center;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
transition: all 0.3s ease;
border-left: 5px solid #ff00ff;
}

.link-card:hover {
transform: translateY(-5px);
box-shadow: 0 8px 25px rgba(255, 0, 255, 0.3);
border-left-color: #ff00ff;
}

.link-icon {
font-size: 2rem;
margin-right: 15px;
width: 50px;
text-align: center;
color: #ff00ff;
}

.link-text {
text-align: left;
}

.link-title {
font-weight: 600;
margin-bottom: 5px;
font-size: 1.2rem;
color: #fff;
}

.link-url {
color: #aaa;
font-size: 0.9rem;
word-break: break-all;
}

.footer {
margin-top: 30px;
color: #777;
font-size: 0.9rem;
}

@media (max-width: 600px) {
.container {
padding: 25px;
}

h1 {
font-size: 2rem;
}

.link-card {
flex-direction: column;
text-align: center;
padding: 25px 20px;
}

.link-icon {
margin-right: 0;
margin-bottom: 10px;
}
}
</style>
