<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin: 0 auto 20px;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #a1c4fd);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        
        .links-grid {
            display: grid;
            gap: 20px;
        }
        
        .link-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-decoration: none;
            color: #333;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border-left: 5px solid #667eea;
        }
        
        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-left-color: #764ba2;
        }
        
        .link-icon {
            font-size: 2rem;
            margin-right: 15px;
            width: 50px;
            text-align: center;
        }
        
        .link-text {
            text-align: left;
        }
        
        .link-title {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 1.2rem;
        }
        
        .link-url {
            color: #666;
            font-size: 0.9rem;
            word-break: break-all;
        }
        
        .footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
        }
        
        .background-decoration {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
        }
        
        .decoration-1 {
            top: -80px;
            left: -80px;
        }
        
        .decoration-2 {
            bottom: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .link-card {
                flex-direction: column;
                text-align: center;
                padding: 25px 20px;
            }
            
            .link-icon {
                margin-right: 0;
                margin-bottom: 10px;
            }
            
            .profile-image {
                width: 100px;
                height: 100px;
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-decoration decoration-1"></div>

        <div class="profile-image">👤</div>

    </div>
</body>
</html>
